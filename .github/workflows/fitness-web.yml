name: Fitness PWA validation
on:
  pull_request:
    paths:
      - apps/fitness-web/**
      - docker-compose.fitness.yml
      - .github/workflows/fitness-web.yml
  push:
    branches: [main]
    paths:
      - apps/fitness-web/**
      - docker-compose.fitness.yml
      - .github/workflows/fitness-web.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: apps/fitness-web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/fitness-web
        run: npm run typecheck
      - name: Build Next.js
        working-directory: apps/fitness-web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Validate separate Compose runtime
        run: |
          docker compose -f docker-compose.fitness.yml config --format json > /tmp/fitness-compose.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/fitness-compose.json',encoding='utf-8'))
          assert set(data['services'])=={'fitness-web'}
          svc=data['services']['fitness-web']
          assert svc['user']=='10001:10001'
          assert svc['read_only'] is True
          assert 'ALL' in svc['cap_drop']
          assert all(port.get('host_ip')=='127.0.0.1' for port in svc['ports'])
          assert svc['ports'][0]['published']=='18081'
          assert not svc.get('volumes')
          assert 'GARMIN_MCP_HTTP_TOKEN' not in svc.get('environment',{})
          print('Standalone fitness PWA Compose verified')
          PY
